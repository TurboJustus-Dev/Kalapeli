<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fin Flight</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: #012A4A;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: none;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; text-align: center; gap: 14px;
    background: rgba(1, 42, 74, 0.55);
    -webkit-backdrop-filter: blur(2px);
  }
  #overlay h1 { font-size: 34px; margin: 0; text-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  #overlay p { margin: 0; font-size: 15px; opacity: 0.9; max-width: 280px; line-height: 1.5; }
  #overlay button {
    margin-top: 6px; padding: 14px 34px; font-size: 18px; font-weight: 700;
    border: none; border-radius: 30px; background: #FFA726; color: #012A4A;
    box-shadow: 0 4px 0 #C77800; cursor: pointer;
  }
  #overlay button:active { box-shadow: 0 1px 0 #C77800; transform: translateY(3px); }
  #overlay button.secondary {
    background: transparent; color: white; box-shadow: none;
    border: 2px solid rgba(255,255,255,0.6); padding: 10px 30px; font-size: 15px;
  }
  #overlay button.secondary:active { transform: translateY(2px); }
  .menu-stats { font-size: 16px; font-weight: 700; opacity: 0.95; }
  .shop-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-width: 320px; max-height: 44vh; overflow-y: auto; padding: 4px;
  }
  .shop-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 6px;
  }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid; }
  .shop-name { font-size: 11px; opacity: 0.9; line-height: 1.2; }
  .shop-btn {
    border: none; border-radius: 14px; padding: 6px 10px; font-size: 12px; font-weight: 700;
    cursor: pointer; color: #012A4A;
  }
  .shop-btn.buy { background: #FFA726; }
  .shop-btn.equip { background: #81C784; }
  .shop-btn.equipped { background: #B0BEC5; }
  .shop-btn.locked { background: rgba(255,255,255,0.25); color: rgba(255,255,255,0.7); }
  #muteBtn { pointer-events: auto; cursor: pointer; }
  #hud {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 16px;
    color: white; font-weight: 700; font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  #hud span { background: rgba(1,42,74,0.35); padding: 4px 10px; border-radius: 12px; }
  #dangerBarWrap {
    position: absolute; bottom: 18px; left: 16px; right: 16px;
    height: 10px; background: rgba(255,255,255,0.25); border-radius: 6px; overflow: hidden;
  }
  #dangerBar { height: 100%; width: 100%; background: #66BB6A; transition: background 0.2s; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <span id="scoreLabel">0 m</span>
    <span id="coinLabel">🪙 0</span>
    <span id="rainbowLabel" style="display:none;">🌈</span>
    <span id="muteBtn">🔊</span>
    <span id="bestLabel">Best: 0 m</span>
  </div>
  <div id="dangerBarWrap"><div id="dangerBar"></div></div>
  <div id="overlay"></div>
  <audio id="bgMusic" src="Rolling-in-the-deep.mp3" loop preload="auto"></audio>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const scoreLabel = document.getElementById('scoreLabel');
  const coinLabel = document.getElementById('coinLabel');
  const rainbowLabel = document.getElementById('rainbowLabel');
  const bestLabel = document.getElementById('bestLabel');
  const dangerBar = document.getElementById('dangerBar');
  const muteBtn = document.getElementById('muteBtn');
  const bgMusic = document.getElementById('bgMusic');

  // ---- persistent progress: coin bank + owned/selected fish colors ----
  function loadCoins(){ return parseInt(localStorage.getItem('finflight_coins') || '0', 10); }
  function saveCoins(v){ localStorage.setItem('finflight_coins', String(v)); }
  function loadOwned(){
    try { return JSON.parse(localStorage.getItem('finflight_owned') || '["orange"]'); }
    catch(e){ return ['orange']; }
  }
  function saveOwned(arr){ localStorage.setItem('finflight_owned', JSON.stringify(arr)); }
  function loadSkin(){ return localStorage.getItem('finflight_skin') || 'orange'; }
  function saveSkin(id){ localStorage.setItem('finflight_skin', id); }

  let coinBank = loadCoins();
  let ownedSkins = loadOwned();
  let currentSkinId = loadSkin();

  const SKINS = [
    { id:'orange',   name:'Classic Orange', price:0,   body:'#FFA726', belly:'#FFE0B2', shape:'classic' },
    { id:'blue',     name:'Ocean Blue',     price:40,  body:'#29B6F6', belly:'#B3E5FC', shape:'classic' },
    { id:'green',    name:'Seaweed Green',  price:40,  body:'#66BB6A', belly:'#C8E6C9', shape:'classic' },
    { id:'pink',     name:'Coral Pink',     price:70,  body:'#EC407A', belly:'#F8BBD0', shape:'classic' },
    { id:'purple',   name:'Royal Purple',   price:70,  body:'#AB47BC', belly:'#E1BEE7', shape:'classic' },
    { id:'gold',     name:'Golden',         price:150, body:'#FFD54F', belly:'#FFF9C4', shape:'classic' },
    { id:'obsidian', name:'Obsidian',       price:150, body:'#37474F', belly:'#90A4AE', shape:'classic' },
    { id:'prism',    name:'Prism',          price:250, body:'#7E57C2', belly:'#B39DDB', shape:'classic' },
    { id:'puffer',   name:'Pufferfish',     price:180, body:'#FDD835', belly:'#FFF59D', shape:'puffer' },
    { id:'shark',    name:'Reef Shark',     price:220, body:'#78909C', belly:'#CFD8DC', shape:'shark' },
  ];
  function currentSkin(){ return SKINS.find(s => s.id === currentSkinId) || SKINS[0]; }

  // ---- sound effects (Web Audio, no external files) ----
  let audioCtx = null;
  let muted = false;
  function ensureAudio(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function sfx(freq, dur, type, vol, delay, glideTo){
    ensureAudio();
    if (muted || !audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function playCoin(){ sfx(880, 0.09, 'triangle', 0.18, 0, 1500); sfx(1500, 0.1, 'triangle', 0.12, 0.05); }
  function playHit(){ sfx(140, 0.18, 'sawtooth', 0.22, 0, 70); }
  function playDeath(){ sfx(320, 0.5, 'sawtooth', 0.22, 0, 45); }
  function playClick(){ sfx(600, 0.06, 'square', 0.1, 0, 900); }
  function playDeny(){ sfx(180, 0.12, 'square', 0.15, 0, 140); }
  function playPower(){
    sfx(440, 0.1, 'triangle', 0.16, 0, 660);
    sfx(660, 0.1, 'triangle', 0.16, 0.08, 990);
    sfx(990, 0.14, 'triangle', 0.18, 0.16, 1320);
  }

  muteBtn.addEventListener('click', ()=>{
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    bgMusic.muted = muted;
    if (!muted) ensureAudio();
  });

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  let best = parseInt(localStorage.getItem('finflight_best') || '0', 10);
  bestLabel.textContent = 'Best: ' + best + ' m';

  const state = {
    running: false,
    over: false,
    scroll: 0,
    speed: 3.2,
    baseSpeed: 3.2,
    maxSpeed: 7.5,
    elapsed: 0,
    distance: 0,
    chaseGap: 100,
    displayGap: 100,
    obstacles: [],
    spawnTimer: 0,
    bubbles: [],
    weeds: [],
    hitFlash: 0,
    coins: [],
    coinTimer: 0,
    coinScore: 0,
    bgFish: [],
    playerBubbles: [],
    mouthTimer: 0,
    shake: 0,
    boulders: [],
    boulderTimer: 0,
    blobs: [],
    blobTimer: 0,
    rainbowTimer: 0,
    rainbowHue: 0,
    dying: false,
    deathT: 0,
    deathDuration: 0.9,
    deathStart: null,
    deathPlayerScale: 1,
  };

  const player = { x: 0, y: 0, targetY: 0, wob: 0, size: 26, tilt: 0 };

  function resetGame(){
    state.running = true;
    state.over = false;
    state.scroll = 0;
    state.speed = state.baseSpeed;
    state.elapsed = 0;
    state.distance = 0;
    state.chaseGap = 100;
    state.displayGap = 100;
    state.obstacles = [];
    state.spawnTimer = 0;
    state.hitFlash = 0;
    state.coins = [];
    state.coinTimer = 0.15;
    state.coinScore = 0;
    state.playerBubbles = [];
    state.mouthTimer = 0;
    state.shake = 0;
    state.boulders = [];
    state.boulderTimer = 3 + Math.random()*2;
    state.blobs = [];
    state.blobTimer = 8 + Math.random()*6;
    state.rainbowTimer = 0;
    state.rainbowHue = 0;
    state.dying = false;
    state.deathT = 0;
    state.deathStart = null;
    state.deathPlayerScale = 1;
    player.x = W * 0.22;
    player.y = H * 0.5;
    player.targetY = player.y;
    state.weeds = [];
    for (let i=0;i<6;i++){
      state.weeds.push({ x: Math.random()*W, h: 60+Math.random()*100, sway: Math.random()*Math.PI*2 });
    }
    state.bubbles = [];
    for (let i=0;i<18;i++){
      state.bubbles.push({ x: Math.random()*W, y: Math.random()*H, r: 2+Math.random()*4, spd: 0.3+Math.random()*0.6 });
    }
    state.bgFish = [];
    const bgColors = ['#4DD0E1','#F06292','#AED581','#FFD54F','#BA68C8','#4FC3F7'];
    for (let i=0;i<10;i++){
      state.bgFish.push({
        x: Math.random()*W, y: 30 + Math.random()*(H-60),
        size: 6 + Math.random()*10,
        color: bgColors[Math.floor(Math.random()*bgColors.length)],
        layerSpeed: 0.15 + Math.random()*0.5,
        wob: Math.random()*Math.PI*2,
        dir: Math.random() < 0.5 ? -1 : 1,
      });
    }
    coinLabel.textContent = '🪙 0';
  }

  // ---- input: drag / swipe to set target Y ----
  let dragging = false;
  function pointerY(e){
    if (e.touches && e.touches.length) return e.touches[0].clientY;
    return e.clientY;
  }
  function onDown(e){
    dragging = true;
    if (!state.running && !state.over) return;
    player.targetY = pointerY(e);
  }
  function onMove(e){
    if (!dragging) return;
    e.preventDefault();
    player.targetY = pointerY(e);
  }
  function onUp(){ dragging = false; }

  canvas.addEventListener('touchstart', onDown, {passive:true});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  window.addEventListener('keydown', (e)=>{
    if (!state.running) return;
    if (e.key === 'ArrowUp') player.targetY -= 60;
    if (e.key === 'ArrowDown') player.targetY += 60;
  });

  function renderMainMenu(){
    overlay.classList.remove('hidden');
    bgMusic.pause();
    overlay.innerHTML = `
      <h1>🐟 Fin Flight</h1>
      <div class="menu-stats">🪙 ${coinBank} &nbsp;·&nbsp; Best: ${best} m</div>
      <p>Drag or swipe up/down to swim. Urchins hit your danger bar hard, spiked fish and boulder walls are instant death — and grab the orange blob for a rainbow burst!</p>
      <button id="playBtn">Play</button>
      <button id="shopBtn" class="secondary">Shop</button>
    `;
    document.getElementById('playBtn').addEventListener('click', ()=>{
      playClick();
      overlay.classList.add('hidden');
      resetGame();
      startMusic();
    });
    document.getElementById('shopBtn').addEventListener('click', ()=>{
      playClick();
      renderShop();
    });
  }

  function startMusic(){
    bgMusic.currentTime = 0;
    bgMusic.muted = muted;
    bgMusic.play().catch(()=>{}); // ignore autoplay-policy rejections
  }

  function renderShop(){
    overlay.classList.remove('hidden');
    const items = SKINS.map(s=>{
      const owned = ownedSkins.includes(s.id);
      const equipped = currentSkinId === s.id;
      const label = equipped ? 'Equipped' : owned ? 'Equip' : ('🪙 ' + s.price);
      const cls = equipped ? 'equipped' : owned ? 'equip' : (coinBank >= s.price ? 'buy' : 'locked');
      return `
        <div class="shop-item">
          <div class="swatch" style="background:${s.body}; border-color:${s.belly}"></div>
          <div class="shop-name">${s.name}</div>
          <button data-id="${s.id}" class="shop-btn ${cls}">${label}</button>
        </div>`;
    }).join('');
    overlay.innerHTML = `
      <h1>Shop</h1>
      <div class="menu-stats">🪙 ${coinBank}</div>
      <div class="shop-grid">${items}</div>
      <button id="backBtn" class="secondary">Back</button>
    `;
    overlay.querySelectorAll('.shop-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-id');
        const skin = SKINS.find(s => s.id === id);
        if (ownedSkins.includes(id)){
          currentSkinId = id; saveSkin(id);
          playClick();
          renderShop();
        } else if (coinBank >= skin.price){
          coinBank -= skin.price; saveCoins(coinBank);
          ownedSkins.push(id); saveOwned(ownedSkins);
          currentSkinId = id; saveSkin(id);
          playCoin();
          renderShop();
        } else {
          playDeny();
        }
      });
    });
    document.getElementById('backBtn').addEventListener('click', ()=>{
      playClick();
      renderMainMenu();
    });
  }

  renderMainMenu();

  // ---- obstacle spawning ----
  function spawnObstacle(){
    const roll = Math.random();
    let type;
    if (roll < 0.32) type = 'rock';
    else if (roll < 0.75) type = 'urchin';
    else type = 'spiked';
    const size = type === 'rock' ? (22 + Math.random()*20) : type === 'urchin' ? (28 + Math.random()*22) : (18 + Math.random()*8);
    const y = 60 + Math.random() * (H - 120);
    state.obstacles.push({ x: W + 40, y, size, type, hit: false, wob: Math.random()*Math.PI*2 });
  }

  // ---- boulders: static instant-kill walls covering 1/3 of the screen height,
  // flush against either the top or bottom edge ----
  function spawnBoulder(){
    const side = Math.random() < 0.5 ? 'top' : 'bottom';
    const height = H / 3;
    const width = 60 + Math.random() * 50;
    state.boulders.push({ x: W + width + 40, width, height, side, hit: false });
  }

  // ---- coin spawning ----
  function spawnCoin(){
    const y = 50 + Math.random() * (H - 100);
    state.coins.push({ x: W + 40, y, r: 12, wob: Math.random()*Math.PI*2, collected: false, life: 0 });
  }

  // ---- rainbow power-up blob ----
  function spawnBlob(){
    const y = 60 + Math.random() * (H - 120);
    state.blobs.push({ x: W + 40, y, r: 16, wob: Math.random()*Math.PI*2, collected: false });
  }

  function update(dt){
    if (state.dying) { updateDeathSequence(dt); return; }
    if (!state.running) return;
    state.elapsed += dt;
    state.speed = Math.min(state.maxSpeed, state.baseSpeed + state.elapsed * 0.045);
    state.distance += state.speed * dt * 0.06;
    state.scroll += state.speed;

    // player smoothing toward target
    const minY = 40, maxY = H - 40;
    player.targetY = Math.max(minY, Math.min(maxY, player.targetY));
    const dy = player.targetY - player.y;
    player.tilt = Math.max(-0.5, Math.min(0.5, dy * 0.01));
    player.y += dy * 0.14;
    player.wob += dt * 6;

    // chase gap regenerates slowly, drained by time pressure slightly, refilled by skill
    state.chaseGap += dt * 6; // recover over time (rewards survival/dodging)
    state.chaseGap = Math.min(100, state.chaseGap);
    // smoothly ease the *displayed* gap toward the real gap so the big fish
    // glides closer/farther instead of snapping on a hit
    state.displayGap += (state.chaseGap - state.displayGap) * Math.min(1, dt * 4.5);
    if (state.hitFlash > 0) state.hitFlash -= dt * 2.5;
    if (state.shake > 0) state.shake -= dt * 4;

    // rainbow power-up mode
    if (state.rainbowTimer > 0){
      state.rainbowTimer -= dt;
      state.rainbowHue = (state.rainbowHue + dt * 220) % 360;
      if (state.rainbowTimer < 0) state.rainbowTimer = 0;
    }

    // spawn obstacles, rate increases with speed
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0){
      spawnObstacle();
      const rate = Math.max(0.55, 1.5 - state.elapsed * 0.01);
      state.spawnTimer = rate + Math.random()*0.4;
    }

    // spawn boulders on their own slower cadence
    state.boulderTimer -= dt;
    if (state.boulderTimer <= 0){
      spawnBoulder();
      state.boulderTimer = 4.5 + Math.random()*3;
    }

    // spawn coins - frequent! roughly 10x the original cadence
    state.coinTimer -= dt;
    if (state.coinTimer <= 0){
      spawnCoin();
      state.coinTimer = 0.16 + Math.random()*0.14;
    }

    // spawn the rainbow blob power-up, rare
    state.blobTimer -= dt;
    if (state.blobTimer <= 0){
      spawnBlob();
      state.blobTimer = 14 + Math.random()*8;
    }

    // move obstacles + collide
    for (let i = state.obstacles.length - 1; i >= 0; i--){
      const o = state.obstacles[i];
      o.x -= state.speed;
      o.wob += dt * 5;
      if (o.x < -50) { state.obstacles.splice(i,1); continue; }
      if (!o.hit){
        const dx = o.x - player.x, ddy = o.y - player.y;
        const rad = o.size * 0.75 + player.size * 0.55;
        if (dx*dx + ddy*ddy < rad*rad){
          o.hit = true;
          if (o.type === 'spiked'){
            startDeathSequence();
            return;
          }
          // urchins hit the danger bar much harder than rocks - two hits back
          // to back (before it can regenerate) is enough to empty it
          state.chaseGap -= (o.type === 'urchin') ? 50 : 22;
          state.hitFlash = 1;
          state.shake = 1;
          playHit();
        }
      }
    }

    // move + collide with static boulder walls (top/bottom, instant kill)
    for (let i = state.boulders.length - 1; i >= 0; i--){
      const o = state.boulders[i];
      o.x -= state.speed;
      if (o.x - o.width < -60) { state.boulders.splice(i,1); continue; }
      if (!o.hit){
        const yTop = o.side === 'top' ? 0 : H - o.height;
        const yBottom = yTop + o.height;
        const clampedX = Math.max(o.x - o.width, Math.min(player.x, o.x));
        const clampedY = Math.max(yTop, Math.min(player.y, yBottom));
        const ddx = player.x - clampedX, ddy = player.y - clampedY;
        const rad = player.size * 0.55;
        if (ddx*ddx + ddy*ddy < rad*rad){
          o.hit = true;
          startDeathSequence();
          return;
        }
      }
    }

    // move + collect rainbow power-up blobs
    for (let i = state.blobs.length - 1; i >= 0; i--){
      const b = state.blobs[i];
      b.x -= state.speed;
      b.wob += dt * 5;
      if (b.x < -40) { state.blobs.splice(i,1); continue; }
      if (!b.collected){
        const dx = b.x - player.x, ddy = b.y - player.y;
        const rad = b.r + player.size * 0.55;
        if (dx*dx + ddy*ddy < rad*rad){
          b.collected = true;
          state.blobs.splice(i,1);
          state.rainbowTimer += 8;
          playPower();
        }
      }
    }

    // move coins + collect
    for (let i = state.coins.length - 1; i >= 0; i--){
      const c = state.coins[i];
      c.x -= state.speed;
      c.wob += dt * 6;
      c.life += dt;
      if (c.x < -30) { state.coins.splice(i,1); continue; }
      if (!c.collected){
        const dx = c.x - player.x, ddy = c.y - player.y;
        const rad = c.r + player.size * 0.55;
        if (dx*dx + ddy*ddy < rad*rad){
          c.collected = true;
          state.coinScore += 1;
          coinLabel.textContent = '🪙 ' + state.coinScore;
          state.coins.splice(i,1);
          playCoin();
        }
      }
    }

    // background decorative fish (no collision, pure ambience)
    for (const f of state.bgFish){
      f.x -= state.speed * f.layerSpeed * (f.dir < 0 ? 1 : 0.4);
      f.wob += dt * 4;
      if (f.dir < 0 && f.x < -20) { f.x = W + 20; f.y = 30 + Math.random()*(H-60); }
      if (f.dir > 0){
        f.x += state.speed * f.layerSpeed * 0.4 + dt * 6;
        if (f.x > W + 20) { f.x = -20; f.y = 30 + Math.random()*(H-60); }
      }
    }

    // bubbles from the player's mouth
    state.mouthTimer -= dt;
    if (state.mouthTimer <= 0){
      state.playerBubbles.push({
        x: player.x + player.size*0.9, y: player.y - player.size*0.05,
        r: 1.5 + Math.random()*2, vy: 0.6 + Math.random()*0.5, vx: 0.3 + Math.random()*0.4,
        life: 1
      });
      state.mouthTimer = 0.12 + Math.random()*0.1;
    }
    for (let i = state.playerBubbles.length - 1; i >= 0; i--){
      const b = state.playerBubbles[i];
      b.x += b.vx; b.y -= b.vy; b.life -= dt * 0.7;
      if (b.life <= 0) state.playerBubbles.splice(i,1);
    }

    // ambient bubbles
    for (const b of state.bubbles){
      b.y -= b.spd; b.x -= state.speed * 0.15;
      if (b.y < -10) { b.y = H + 10; b.x = Math.random()*W; }
      if (b.x < -10) b.x = W + 10;
    }
    for (const w of state.weeds){
      w.x -= state.speed * 0.35;
      w.sway += dt * 1.5;
      if (w.x < -20) w.x = W + 20;
    }

    if (state.chaseGap <= 0){
      startDeathSequence();
    }
  }

  // ---- death sequence: the chaser rushes in and "eats" the player before
  // the game-over screen appears ----
  function computeChaserXY(){
    const maxOffset = W * 0.34;
    const offset = maxOffset * (state.displayGap/100) + player.size*1.4;
    const chaserSize = player.size * 2.1;
    const chaserX = Math.max(chaserSize*0.5, player.x - offset);
    const chaserY = player.y + Math.sin(state.scroll*0.02)*10;
    return { x: chaserX, y: chaserY, size: chaserSize };
  }

  function startDeathSequence(){
    if (state.dying || !state.running) return;
    state.dying = true;
    state.deathT = 0;
    state.deathStart = computeChaserXY();
    state.deathPlayerScale = 1;
    state.shake = 1.4;
    playDeath();
  }

  function updateDeathSequence(dt){
    state.deathT += dt;
    const t = Math.min(1, state.deathT / state.deathDuration);
    const rushT = Math.min(1, t / 0.55);           // first 55%: chaser rushes in
    const swallowT = Math.max(0, (t - 0.55) / 0.45); // last 45%: player shrinks away
    const rushEase = 1 - Math.pow(1 - rushT, 3);
    const swallowEase = swallowT * swallowT;

    const biteX = player.x + player.size * 0.5;
    const biteY = player.y;
    state.deathChaserX = state.deathStart.x + (biteX - state.deathStart.x) * rushEase;
    state.deathChaserY = state.deathStart.y + (biteY - state.deathStart.y) * rushEase;
    state.deathChaserSize = state.deathStart.size * (1 + 0.18 * Math.sin(rushEase * Math.PI));
    state.deathPlayerScale = 1 - swallowEase;

    if (state.shake > 0) state.shake -= dt * 2.2;

    if (t >= 1){
      state.dying = false;
      finalizeGameOver();
    }
  }

  function finalizeGameOver(){
    state.running = false;
    state.over = true;
    bgMusic.pause();
    const dist = Math.round(state.distance);
    if (dist > best){ best = dist; localStorage.setItem('finflight_best', String(best)); }
    bestLabel.textContent = 'Best: ' + best + ' m';
    coinBank += state.coinScore;
    saveCoins(coinBank);
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1>Caught! 🦈</h1>
      <p>You swam <strong>${dist} m</strong> and grabbed <strong>${state.coinScore} coins</strong> (🪙 ${coinBank} total).</p>
      <button id="retryBtn">Swim Again</button>
      <button id="menuBtn" class="secondary">Main Menu</button>
    `;
    document.getElementById('retryBtn').addEventListener('click', ()=>{
      playClick();
      overlay.classList.add('hidden');
      resetGame();
      startMusic();
    });
    document.getElementById('menuBtn').addEventListener('click', ()=>{
      playClick();
      renderMainMenu();
    });
  }

  // ---- drawing helpers ----
  function drawFish(x, y, size, bodyColor, bellyColor, tilt, wob, angry, shape){
    if (shape === 'puffer'){ drawPufferFish(x, y, size, bodyColor, bellyColor, tilt, wob, angry); return; }
    if (shape === 'shark'){ drawSharkFish(x, y, size, bodyColor, bellyColor, tilt, wob, angry); return; }
    drawClassicFish(x, y, size, bodyColor, bellyColor, tilt, wob, angry);
  }

  function drawClassicFish(x, y, size, bodyColor, bellyColor, tilt, wob, angry){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt + Math.sin(wob) * 0.05);
    // tail
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    const tailWag = Math.sin(wob * 1.4) * size * 0.25;
    ctx.moveTo(-size*0.95, 0);
    ctx.lineTo(-size*1.6, -size*0.55 + tailWag);
    ctx.lineTo(-size*1.6, size*0.55 + tailWag);
    ctx.closePath();
    ctx.fill();
    // body
    ctx.beginPath();
    ctx.ellipse(0, 0, size, size*0.62, 0, 0, Math.PI*2);
    ctx.fill();
    // belly
    ctx.fillStyle = bellyColor;
    ctx.beginPath();
    ctx.ellipse(size*0.05, size*0.18, size*0.7, size*0.32, 0, 0, Math.PI*2);
    ctx.fill();
    // top fin
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(-size*0.1, -size*0.55);
    ctx.lineTo(size*0.25, -size*1.0);
    ctx.lineTo(size*0.4, -size*0.5);
    ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(size*0.55, -size*0.08, size*0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0b0b0b';
    ctx.beginPath();
    ctx.arc(size*0.6, -size*0.08, size*0.1, 0, Math.PI*2);
    ctx.fill();
    if (angry){
      // teeth
      ctx.fillStyle = 'white';
      for (let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.moveTo(size*0.7 + i*size*0.18, size*0.28);
        ctx.lineTo(size*0.62 + i*size*0.18, size*0.42);
        ctx.lineTo(size*0.78 + i*size*0.18, size*0.42);
        ctx.closePath();
        ctx.fill();
      }
      // angry brow
      ctx.strokeStyle = '#0b0b0b';
      ctx.lineWidth = size*0.08;
      ctx.beginPath();
      ctx.moveTo(size*0.3, -size*0.32);
      ctx.lineTo(size*0.75, -size*0.2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPufferFish(x, y, size, bodyColor, bellyColor, tilt, wob, angry){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt + Math.sin(wob) * 0.04);
    // small tail (chubby fish barely has one)
    ctx.fillStyle = bodyColor;
    const tailWag = Math.sin(wob * 1.3) * size * 0.15;
    ctx.beginPath();
    ctx.moveTo(-size*0.85, 0);
    ctx.lineTo(-size*1.15, -size*0.3 + tailWag);
    ctx.lineTo(-size*1.15, size*0.3 + tailWag);
    ctx.closePath();
    ctx.fill();
    // round chubby body
    ctx.beginPath();
    ctx.arc(0, 0, size*0.85, 0, Math.PI*2);
    ctx.fill();
    // belly
    ctx.fillStyle = bellyColor;
    ctx.beginPath();
    ctx.arc(size*0.08, size*0.22, size*0.55, 0, Math.PI*2);
    ctx.fill();
    // spikes all around
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = size*0.06;
    const spikeCount = 12;
    for (let i=0;i<spikeCount;i++){
      const a = (i/spikeCount) * Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*size*0.8, Math.sin(a)*size*0.8);
      ctx.lineTo(Math.cos(a)*size*1.05, Math.sin(a)*size*1.05);
      ctx.stroke();
    }
    // big round eye
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(size*0.42, -size*0.12, size*0.24, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0b0b0b';
    ctx.beginPath();
    ctx.arc(size*0.48, -size*0.1, size*0.12, 0, Math.PI*2);
    ctx.fill();
    // small pouty mouth
    ctx.strokeStyle = '#0b0b0b';
    ctx.lineWidth = size*0.05;
    ctx.beginPath();
    ctx.arc(size*0.7, size*0.12, size*0.1, 0.2, Math.PI - 0.2);
    ctx.stroke();
    ctx.restore();
  }

  function drawSharkFish(x, y, size, bodyColor, bellyColor, tilt, wob, angry){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt + Math.sin(wob) * 0.04);
    // crescent tail
    ctx.fillStyle = bodyColor;
    const tailWag = Math.sin(wob * 1.4) * size * 0.2;
    ctx.beginPath();
    ctx.moveTo(-size*1.1, 0);
    ctx.quadraticCurveTo(-size*1.5, -size*0.7 + tailWag, -size*1.75, -size*0.85 + tailWag);
    ctx.quadraticCurveTo(-size*1.35, -size*0.15 + tailWag, -size*1.3, 0);
    ctx.quadraticCurveTo(-size*1.35, size*0.15 + tailWag, -size*1.75, size*0.85 + tailWag);
    ctx.quadraticCurveTo(-size*1.5, size*0.7 + tailWag, -size*1.1, 0);
    ctx.fill();
    // sleek tapering body (pointed nose, wider mid)
    ctx.beginPath();
    ctx.moveTo(size*1.15, 0);
    ctx.quadraticCurveTo(size*0.6, -size*0.5, -size*0.2, -size*0.42);
    ctx.quadraticCurveTo(-size*0.9, -size*0.3, -size*1.1, 0);
    ctx.quadraticCurveTo(-size*0.9, size*0.3, -size*0.2, size*0.42);
    ctx.quadraticCurveTo(size*0.6, size*0.5, size*1.15, 0);
    ctx.fill();
    // pale belly
    ctx.fillStyle = bellyColor;
    ctx.beginPath();
    ctx.ellipse(size*0.05, size*0.2, size*0.75, size*0.22, 0, 0, Math.PI*2);
    ctx.fill();
    // dorsal fin
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(-size*0.05, -size*0.4);
    ctx.lineTo(size*0.15, -size*0.95);
    ctx.lineTo(size*0.35, -size*0.38);
    ctx.closePath();
    ctx.fill();
    // gill slits
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = size*0.035;
    for (let i=0;i<3;i++){
      const gx = size*0.55 - i*size*0.09;
      ctx.beginPath();
      ctx.moveTo(gx, -size*0.28);
      ctx.lineTo(gx - size*0.05, size*0.05);
      ctx.stroke();
    }
    // eye
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(size*0.75, -size*0.08, size*0.14, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0b0b0b';
    ctx.beginPath();
    ctx.arc(size*0.8, -size*0.08, size*0.07, 0, Math.PI*2);
    ctx.fill();
    if (angry){
      ctx.strokeStyle = '#0b0b0b';
      ctx.lineWidth = size*0.06;
      ctx.beginPath();
      ctx.moveTo(size*0.55, -size*0.28);
      ctx.lineTo(size*0.95, -size*0.15);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawObstacle(o){
    if (o.type === 'spiked'){ drawSpikedFish(o); return; }
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.type === 'rock'){
      ctx.fillStyle = o.hit ? '#7a8a94' : '#8FA3AD';
      ctx.beginPath();
      ctx.ellipse(0,0, o.size, o.size*0.78, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.ellipse(-o.size*0.3,-o.size*0.25, o.size*0.4, o.size*0.25, 0, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = o.hit ? '#5b2a6b' : '#7B2D8E';
      ctx.beginPath();
      ctx.arc(0,0, o.size*0.6, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = o.hit ? '#5b2a6b' : '#7B2D8E';
      ctx.lineWidth = 2.5;
      const spikes = 10;
      for (let i=0;i<spikes;i++){
        const a = (i/spikes) * Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*o.size*0.55, Math.sin(a)*o.size*0.55);
        ctx.lineTo(Math.cos(a)*o.size*1.15, Math.sin(a)*o.size*1.15);
        ctx.stroke();
      }
    }
    ctx.restore();
  }


  function drawSpikedFish(o){
    ctx.save();
    ctx.translate(o.x, o.y);
    const bob = Math.sin(o.wob) * o.size * 0.15;
    ctx.translate(0, bob);
    const s = o.size;
    // spikes radiating around body
    ctx.strokeStyle = '#37474F';
    ctx.lineWidth = 2.2;
    const spikeCount = 9;
    for (let i=0;i<spikeCount;i++){
      const a = (i/spikeCount) * Math.PI*2 + o.wob*0.3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*s*0.7, Math.sin(a)*s*0.55);
      ctx.lineTo(Math.cos(a)*s*1.5, Math.sin(a)*s*1.15);
      ctx.stroke();
    }
    // body
    ctx.fillStyle = '#FF7043';
    ctx.beginPath();
    ctx.ellipse(0, 0, s, s*0.72, 0, 0, Math.PI*2);
    ctx.fill();
    // tail
    ctx.beginPath();
    ctx.moveTo(-s*0.85, 0);
    ctx.lineTo(-s*1.3, -s*0.4);
    ctx.lineTo(-s*1.3, s*0.4);
    ctx.closePath();
    ctx.fill();
    // eye (angry)
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(s*0.4, -s*0.05, s*0.22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#B71C1C';
    ctx.beginPath(); ctx.arc(s*0.44, -s*0.05, s*0.1, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#37474F'; ctx.lineWidth = s*0.09;
    ctx.beginPath(); ctx.moveTo(s*0.15,-s*0.28); ctx.lineTo(s*0.55,-s*0.15); ctx.stroke();
    ctx.restore();
  }

  function drawCoin(c){
    ctx.save();
    ctx.translate(c.x, c.y + Math.sin(c.wob)*4);
    const squash = Math.abs(Math.sin(c.wob*0.7)) * 0.4 + 0.6; // spin illusion
    ctx.scale(squash, 1);
    ctx.fillStyle = '#FFD54F';
    ctx.beginPath();
    ctx.arc(0, 0, c.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#F9A825';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = '#F9A825';
    ctx.font = 'bold ' + (c.r*1.1) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 1);
    ctx.restore();
  }

  function drawBgFish(f){
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.dir > 0) ctx.scale(-1, 1);
    ctx.globalAlpha = 0.55;
    const s = f.size;
    const wag = Math.sin(f.wob*1.6) * s * 0.3;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.moveTo(-s*0.9, 0);
    ctx.lineTo(-s*1.5, -s*0.5+wag);
    ctx.lineTo(-s*1.5, s*0.5+wag);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, Math.sin(f.wob)*3, s, s*0.6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawBoulderWall(o){
    const yTop = o.side === 'top' ? 0 : H - o.height;
    const yBottom = yTop + o.height;
    const xLeft = o.x - o.width, xRight = o.x;
    const edgeY = o.side === 'top' ? yBottom : yTop;
    const teeth = Math.max(3, Math.round(o.width / 22));

    ctx.save();
    ctx.fillStyle = '#4E4A47';
    ctx.beginPath();
    if (o.side === 'top'){
      ctx.moveTo(xLeft, yTop);
      ctx.lineTo(xRight, yTop);
      ctx.lineTo(xRight, edgeY);
      for (let i = teeth; i >= 0; i--){
        const tx = xLeft + (o.width / teeth) * i;
        const jag = edgeY - 8 - Math.abs(Math.sin(i * 1.7 + o.x * 0.02)) * 12;
        ctx.lineTo(tx, jag);
      }
      ctx.lineTo(xLeft, yTop);
    } else {
      ctx.moveTo(xLeft, yBottom);
      ctx.lineTo(xRight, yBottom);
      ctx.lineTo(xRight, edgeY);
      for (let i = teeth; i >= 0; i--){
        const tx = xLeft + (o.width / teeth) * i;
        const jag = edgeY + 8 + Math.abs(Math.sin(i * 1.7 + o.x * 0.02)) * 12;
        ctx.lineTo(tx, jag);
      }
      ctx.lineTo(xLeft, yBottom);
    }
    ctx.closePath();
    ctx.fill();

    // mottled texture
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(xLeft + o.width*0.3, (yTop+yBottom)/2, o.width*0.18, o.height*0.1, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(xLeft + o.width*0.68, (yTop+yBottom)/2 - o.height*0.08, o.width*0.14, o.height*0.08, -0.2, 0, Math.PI*2); ctx.fill();

    // warning cracks near the exposed jagged edge - this thing is instant death
    ctx.strokeStyle = o.hit ? 'rgba(255,255,255,0.7)' : '#E53935';
    ctx.lineWidth = 3;
    const cx = xLeft + o.width*0.5;
    const dirIn = o.side === 'top' ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(cx, edgeY);
    ctx.lineTo(cx - o.width*0.15, edgeY + dirIn*o.height*0.22);
    ctx.moveTo(cx, edgeY);
    ctx.lineTo(cx + o.width*0.12, edgeY + dirIn*o.height*0.16);
    ctx.stroke();
    ctx.restore();
  }

  function drawBlob(b){
    ctx.save();
    const bob = Math.sin(b.wob) * 4;
    ctx.translate(b.x, b.y + bob);
    const squish = 1 + Math.sin(b.wob*1.6)*0.08;
    ctx.scale(squish, 1/squish);
    // soft glow so it reads as a pickup, not a hazard
    ctx.fillStyle = 'rgba(255,167,38,0.25)';
    ctx.beginPath(); ctx.arc(0, 0, b.r*1.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF9800';
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(-b.r*0.3, -b.r*0.35, b.r*0.35, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function draw(){
    // water background gradient
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#4FC3F7');
    g.addColorStop(1, '#01364F');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    if (state.shake > 0){
      const mag = state.shake * 6;
      ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
    }

    // background decorative fish (behind weeds/obstacles, purely ambient)
    for (const f of state.bgFish) drawBgFish(f);

    // weeds (background)
    for (const w of state.weeds){
      ctx.strokeStyle = 'rgba(20,110,80,0.5)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(w.x, H);
      const midX = w.x + Math.sin(w.sway) * 14;
      ctx.quadraticCurveTo(midX, H - w.h*0.6, w.x + Math.sin(w.sway*1.3)*10, H - w.h);
      ctx.stroke();
    }

    // bubbles
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (const b of state.bubbles){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
    }

    if (!state.running && !state.over) { ctx.restore(); return; }

    // static boulder walls (terrain-like, drawn early so creatures sit in front)
    for (const o of state.boulders) drawBoulderWall(o);

    // coins
    for (const c of state.coins) drawCoin(c);

    // rainbow power-up blobs
    for (const b of state.blobs) drawBlob(b);

    // big fish - during the death sequence it's driven by the eat animation,
    // otherwise its distance is based on the smoothed display gap so it
    // glides in/out, clamped so it's always at least partly on-screen
    let chaserX, chaserY, chaserSize;
    if (state.dying){
      chaserX = state.deathChaserX;
      chaserY = state.deathChaserY;
      chaserSize = state.deathChaserSize;
    } else {
      const maxOffset = W * 0.34;
      const offset = maxOffset * (state.displayGap/100) + player.size*1.4;
      chaserSize = player.size * 2.1;
      chaserX = Math.max(chaserSize*0.5, player.x - offset);
      chaserY = player.y + Math.sin(state.scroll*0.02)*10;
    }
    drawFish(chaserX, chaserY, chaserSize, '#B71C1C', '#E57373', 0, state.scroll*0.05, true);

    // obstacles
    for (const o of state.obstacles) drawObstacle(o);

    // player's mouth bubbles
    for (const b of state.playerBubbles){
      ctx.globalAlpha = Math.max(0, b.life) * 0.6;
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // player fish - rainbow colors while the power-up is active, shrinks
    // away during the death sequence, flashes white briefly on a normal hit
    const skin = currentSkin();
    let bodyColor = skin.body, bellyColor = skin.belly;
    if (state.rainbowTimer > 0){
      bodyColor = `hsl(${state.rainbowHue}, 85%, 55%)`;
      bellyColor = `hsl(${(state.rainbowHue + 40) % 360}, 90%, 82%)`;
    }
    if (state.hitFlash > 0 && !state.dying){
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(state.hitFlash*30)*0.3;
      drawFish(player.x, player.y, player.size, '#FFFFFF', '#FFFFFF', player.tilt, player.wob, false, skin.shape);
      ctx.restore();
    }
    ctx.save();
    if (state.deathPlayerScale < 1){
      ctx.translate(player.x, player.y);
      ctx.scale(Math.max(0, state.deathPlayerScale), Math.max(0, state.deathPlayerScale));
      ctx.translate(-player.x, -player.y);
    }
    drawFish(player.x, player.y, player.size, bodyColor, bellyColor, player.tilt, player.wob, false, skin.shape);
    ctx.restore();

    ctx.restore();

    // HUD updates
    scoreLabel.textContent = Math.round(state.distance) + ' m';
    rainbowLabel.style.display = state.rainbowTimer > 0 ? 'inline' : 'none';
    const pct = Math.max(0, Math.min(100, state.displayGap));
    dangerBar.style.width = pct + '%';
    dangerBar.style.background = pct > 50 ? '#66BB6A' : pct > 22 ? '#FFB300' : '#E53935';
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - last)/1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
